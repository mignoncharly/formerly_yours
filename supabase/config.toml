# Supabase configuration for Once Was Yours.
# We run Docker-less: migrations are pushed to cloud projects (dev/staging/prod)
# with `supabase link` + `supabase db push`. See supabase/README.md.
project_id = "once-was-yours"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[storage]
enabled = true
