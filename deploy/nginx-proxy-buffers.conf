# Once Was Yours — nginx proxy buffer sizes.
#
# Why: on a successful magic-link / OTP confirmation, Supabase (SSR) writes the
# session as a large `sb-<ref>-auth-token` cookie, split across several
# Set-Cookie response headers. nginx's default proxy_buffer_size (8k) can't hold
# them, so /auth/confirm returns "502 Bad Gateway" with
#   "upstream sent too big header while reading response header from upstream".
# A bad token sets no cookie, so it *looks* fine — only real confirmations fail.
#
# Install as an http-context drop-in (applies to all proxied vhosts on the box;
# larger buffers are non-breaking — they only cost a little memory per request):
#   sudo cp deploy/nginx-proxy-buffers.conf /etc/nginx/conf.d/proxy-buffers.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Or paste these three directives into the oncewasyours server/location block.)

proxy_buffer_size   16k;
proxy_buffers       8 16k;
proxy_busy_buffers_size 32k;
