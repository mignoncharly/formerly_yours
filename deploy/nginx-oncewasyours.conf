# Once Was Yours — nginx vhost for the PRODUCTION domain oncewasyours.com.
#
# Install (needs sudo):
#   sudo cp deploy/nginx-oncewasyours.conf /etc/nginx/sites-available/oncewasyours
#   sudo ln -sf /etc/nginx/sites-available/oncewasyours /etc/nginx/sites-enabled/oncewasyours
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d oncewasyours.com -d www.oncewasyours.com
# Certbot rewrites this file to add the :443 SSL block + an HTTP->HTTPS redirect.
#
# DNS first: A record oncewasyours.com -> 217.154.166.155 (and www: A or CNAME).

server {
    listen 80;
    listen [::]:80;
    server_name oncewasyours.com www.oncewasyours.com;

    # Larger proxy buffers: Supabase's session cookie on /auth/confirm is split
    # across several big Set-Cookie headers and overflows the 8k default -> 502.
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Optional: keep the old staging domain working by 301-redirecting it to the new
# canonical domain (good for existing links / SEO). Certbot can also manage this.
