name: E2E smoke

# Public happy-path smoke against a live deployment. Needs no app secrets — it
# drives the deployed site over HTTP. Runs after a push to main (post-deploy),
# on a schedule (synthetic uptime monitor), and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://oncewasyours.gestionatech.de"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Prefer the manual input, else the repo variable, else production.
      PLAYWRIGHT_BASE_URL: >-
        ${{ github.event.inputs.base_url
            || vars.PLAYWRIGHT_BASE_URL
            || 'https://oncewasyours.gestionatech.de' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
